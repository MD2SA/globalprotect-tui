name: CI

on:
  push:
  pull_request:

jobs:
  gp-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools binutils shellcheck
      - name: Shellcheck scripts
        run: shellcheck install.sh installers/arch/gp_install_arch.sh installers/arch/tests/test_installer.sh
      - name: Syntax check install script
        run: bash -n install.sh
      - name: Syntax check installer
        run: bash -n installers/arch/gp_install_arch.sh
      - name: Syntax check installer tests
        run: bash -n installers/arch/tests/test_installer.sh
      - name: Run installer regression tests
        run: bash installers/arch/tests/test_installer.sh
