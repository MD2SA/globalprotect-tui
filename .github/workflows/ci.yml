name: CI

on:
  push:
  pull_request:

jobs:
  gp-tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gp-tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gp-tui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools binutils shellcheck
      - name: Shellcheck installer scripts
        run: shellcheck gp_install_arch.sh tests/installer/test_installer.sh
      - name: Syntax check installer
        run: bash -n gp_install_arch.sh
      - name: Syntax check installer tests
        run: bash -n tests/installer/test_installer.sh
      - name: Run installer regression tests
        run: bash tests/installer/test_installer.sh
